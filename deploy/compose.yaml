name: dev-universe-blog
services:
  blog:
    image: nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    container_name: dev-universe-blog
    user: '101:101'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    volumes:
      - ./site:/site:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
    networks: [web]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dev-universe-blog_web
      traefik.http.routers.dev-universe-blog.rule: Host(`dev-universe.tech`) || Host(`www.dev-universe.tech`)
      traefik.http.routers.dev-universe-blog.entrypoints: websecure
      traefik.http.routers.dev-universe-blog.tls.certresolver: letsencrypt
      traefik.http.routers.dev-universe-blog.middlewares: dev-universe-blog-canonical
      traefik.http.middlewares.dev-universe-blog-canonical.redirectregex.regex: ^https://www\.dev-universe\.tech/(.*)
      traefik.http.middlewares.dev-universe-blog-canonical.redirectregex.replacement: https://dev-universe.tech/$${1}
      traefik.http.middlewares.dev-universe-blog-canonical.redirectregex.permanent: 'true'
      traefik.http.services.dev-universe-blog.loadbalancer.server.port: '8080'
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  web:
